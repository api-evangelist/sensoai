aid: sensoai
name: Senso.ai
description: Senso.ai is a verified-context layer for the agentic web that keeps AI agents aligned
  with an organization's ground truth. Teams ingest raw sources into a knowledge base, run semantic
  search that returns an AI-generated answer plus the source chunks, and generate verified, on-brand
  content from that knowledge. Senso also tracks how AI assistants (OpenAI, Gemini, Amazon Nova)
  answer questions about a brand and remediates incorrect answers (generative engine optimization).
  The Senso Org API is a key-authenticated REST API at https://apiv2.senso.ai/api/v1, with an
  official CLI and a Model Context Protocol (MCP) server so agents like Claude can ingest, search,
  and generate against a knowledge base directly.
